name: Container

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and smoke test
        run: |
          docker build --tag team04:test .
          container_id="$(docker run --detach --publish 6767:6767 team04:test)"
          trap 'docker rm --force "$container_id"' EXIT

          for _ in {1..10}; do
            if curl --fail --silent http://127.0.0.1:6767/up; then
              curl --fail --silent --output /dev/null http://127.0.0.1:6767/static/aboutPage.html
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1
