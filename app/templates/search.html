{{define "content"}}
<input type="search" name="query" placeholder={{.Placeholder}} hx-get="/studygroups"
	hx-trigger="input changed delay:100ms, keyup[key=='Enter']" hx-target="#search-results" hx-push-url="true">

<table>
	<thead>
		<tr>
			<th>Name</th>
			<th>Short Description</th>
			<th>Long Description</th>
		</tr>
	</thead>
	<tbody id="search-results">
		{{template "rows" .}}
	</tbody>
</table>
{{end}}

{{define "rows"}}

{{range .Groups}}
{{template "row" .}}
{{end}}

{{end}}

{{define "row"}}
<tr>
	<td>{{ .Name}}</td>
	<td>{{ .ShortDescription}}</td>
	<td>{{ .LongDescription}}</td>
</tr>
{{end}}
