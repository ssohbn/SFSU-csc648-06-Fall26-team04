<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Study Groups</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/htmx.org"></script>
</head>

<body>
    <main class="search-page">
        <header>
            <h1>Search Study Groups</h1>
            <p class="subtitle">Find groups by name or description.</p>
        </header>

        <!-- search box stuff -->
        <section class="search-section" aria-labelledby="search-heading">
            <h2 id="search-heading">Search groups</h2>

            <!-- go reads the search text from the "query" parameter. -->
            <form class="search-fields"
                  action="/studygroups/"
                  method="get"
                  hx-get="/studygroups/"
                  hx-trigger="input changed delay:300ms, submit"
                  hx-target="#search-results"
                  hx-swap="innerHTML"
                  hx-sync="this:replace">

                <label class="visually-hidden" for="group-query">
                    Search study groups
                </label>
                <input id="group-query"
                       type="search"
                       name="query"
                       placeholder="Search groups..."
                       autocomplete="off">

                <button type="submit">Search</button>
            </form>
        </section>

        <!-- search results go here -->
        <section class="results-section" aria-labelledby="results-heading">
            <h2 id="results-heading">Search results</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Short Description</th>
                            <th scope="col">Long Description</th>
                        </tr>
                    </thead>
                    <tbody id="search-results">
                        <!-- HTMX replaces this message with rows from go -->
                        <tr>
                            <td colspan="3">Enter a search to find study groups.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
